name: lautscan

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lautscan}
      POSTGRES_USER: ${POSTGRES_USER:-lautscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lautscan_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lautscan} -d $${POSTGRES_DB:-lautscan}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lautscan}
      POSTGRES_USER: ${POSTGRES_USER:-lautscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lautscan_dev_password}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lautscan:lautscan_dev_password@db:5432/lautscan}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TILE_CACHE_DIR: /data/tiles
      API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:8080}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NOAA_ERDDAP_BASE_URL: ${NOAA_ERDDAP_BASE_URL:-https://coastwatch.pfeg.noaa.gov/erddap}
      OBIS_API_BASE_URL: ${OBIS_API_BASE_URL:-https://api.obis.org/v3}
      COPERNICUS_USERNAME: ${COPERNICUS_USERNAME:-}
      COPERNICUS_PASSWORD: ${COPERNICUS_PASSWORD:-}
      PDPI_BASE_URL: ${PDPI_BASE_URL:-}
      GFW_API_TOKEN: ${GFW_API_TOKEN:-}
    volumes:
      - ../backend/app:/app/app
      - ../data:/app/data:ro
      - tile_cache:/data/tiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["arq", "app.etl.worker.WorkerSettings"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-lautscan}
      POSTGRES_USER: ${POSTGRES_USER:-lautscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lautscan_dev_password}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lautscan:lautscan_dev_password@db:5432/lautscan}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TILE_CACHE_DIR: /data/tiles
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NOAA_ERDDAP_BASE_URL: ${NOAA_ERDDAP_BASE_URL:-https://coastwatch.pfeg.noaa.gov/erddap}
      OBIS_API_BASE_URL: ${OBIS_API_BASE_URL:-https://api.obis.org/v3}
      COPERNICUS_USERNAME: ${COPERNICUS_USERNAME:-}
      COPERNICUS_PASSWORD: ${COPERNICUS_PASSWORD:-}
      PDPI_BASE_URL: ${PDPI_BASE_URL:-}
      GFW_API_TOKEN: ${GFW_API_TOKEN:-}
    volumes:
      - ../backend/app:/app/app
      - ../data:/app/data:ro
      - tile_cache:/data/tiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  tile_cache:
